document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Saira';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"713ffea4-6bef-46d8-ad30-c000641d481a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Saira';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"2d9ae16e-83ed-44e8-9175-bdc8465ebe03\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{\n  --bg:#000;\n  --bg-1:#070707;\n  --bg-2:#0d0d0d;\n  --surface:#121212;\n  --surface-2:#171717;\n  --line:rgba(255,255,255,.07);\n  --line-2:rgba(255,255,255,.12);\n  --text:#f4f4f4;\n  --muted:#8a8a8a;\n  --muted-2:#5a5a5a;\n  --accent:#a8e635;\n  --accent-2:#86c020;\n  --accent-glow:rgba(168,230,53,.35);\n  --display:\"Saira\", system-ui, sans-serif;\n  --body:\"Manrope\", system-ui, sans-serif;\n  --mono:\"JetBrains Mono\", ui-monospace, monospace;\n  --maxw:1280px;\n  --pad:clamp(20px,4vw,48px);\n  --radius:14px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\nhtml{scroll-behavior:smooth}\nbody{overflow-x:hidden;line-height:1.55}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\nbutton{font-family:inherit;cursor:pointer}\n\n/* ============== Typography system ============== */\n.h-display{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:.95}\n.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}\n.eyebrow .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:10px;vertical-align:middle;box-shadow:0 0 12px var(--accent-glow)}\n.section-title{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,64px);letter-spacing:-.02em;line-height:1;margin:18px 0 0}\n.section-sub{color:var(--muted);font-size:17px;max-width:60ch;margin:18px 0 0}\n\n/* ============== Layout ============== */\n.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}\nsection{position:relative;padding:clamp(80px,10vw,140px) 0;border-top:1px solid var(--line)}\nsection:first-of-type{border-top:0}\n\n/* ============== Nav ============== */\nnav.top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);transition:background .3s ease,border-color .3s ease,backdrop-filter .3s ease;border-bottom:1px solid transparent}\nnav.top.scrolled{background:rgba(7,7,7,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}\n.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.22em;display:flex;align-items:center;gap:10px}\n.logo .x{color:var(--accent);position:relative}\n.logo .x::after{content:\"\";position:absolute;left:-6px;right:-3px;top:50%;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}\n.logo:hover .x::after{transform:scaleX(1)}\n.nav-links{display:flex;gap:32px;align-items:center}\n.nav-links a{font-size:14px;color:var(--muted);transition:color .2s ease;position:relative}\n.nav-links a:hover{color:var(--text)}\n.nav-cta{display:flex;align-items:center;gap:14px}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:14px;letter-spacing:.01em;border:1px solid transparent;transition:transform .2s ease,background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;white-space:nowrap}\n.btn-primary{background:var(--accent);color:#0a0a0a;box-shadow:0 0 0 0 var(--accent-glow)}\n.btn-primary:hover{background:#bdf24a;box-shadow:0 0 30px var(--accent-glow);transform:translateY(-1px)}\n.btn-ghost{background:transparent;color:var(--text);border-color:var(--line-2)}\n.btn-ghost:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.04)}\n.btn-text{background:transparent;color:var(--text);padding:13px 6px}\n.btn-text:hover{color:var(--accent)}\n.btn .arrow{width:14px;height:14px;transition:transform .25s ease}\n.btn:hover .arrow{transform:translateX(3px)}\n.menu-btn{display:none;background:none;border:0;color:var(--text);padding:8px;border-radius:8px}\n.menu-btn svg{width:24px;height:24px}\n\n/* ============== Hero ============== */\n.hero{padding-top:140px;padding-bottom:0;border-top:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}\n.hero::before{content:\"\";position:absolute;inset:0;background:\n  radial-gradient(900px 600px at 85% 50%, rgba(168,230,53,.06), transparent 60%),\n  radial-gradient(1200px 800px at 10% 10%, rgba(255,255,255,.04), transparent 70%),\n  linear-gradient(180deg,#000 0%,#050505 100%);\n  z-index:-1}\n.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;width:100%}\n.hero-copy{position:relative;z-index:2}\n.hero-h1{font-family:var(--display);font-weight:700;font-size:clamp(46px,7vw,96px);line-height:.93;letter-spacing:-.025em;margin:24px 0 0}\n.hero-h1 .accent{color:var(--accent);font-style:italic;font-weight:600}\n.hero-h1 .line-through{position:relative;display:inline-block}\n.hero-h1 .line-through::after{content:\"\";position:absolute;left:-4%;right:-4%;top:54%;height:6px;background:var(--accent);box-shadow:0 0 24px var(--accent-glow)}\n.hero-sub{color:var(--muted);font-size:clamp(16px,1.5vw,19px);max-width:48ch;margin:28px 0 0;line-height:1.6}\n.hero-cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px;align-items:center}\n.hero-contact{display:flex;gap:24px;margin-top:42px;padding-top:28px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);flex-wrap:wrap}\n.hero-contact a{color:var(--text);display:inline-flex;align-items:center;gap:8px;transition:color .2s}\n.hero-contact a:hover{color:var(--accent)}\n.hero-contact svg{width:16px;height:16px;color:var(--accent)}\n\n.hero-visual{position:relative;aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line-2);background:#000}\n.hero-visual img{width:100%;height:100%;object-fit:cover;object-position:center}\n.hero-visual::after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.4));pointer-events:none}\n.hero-visual .badge{position:absolute;top:18px;left:18px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);display:flex;align-items:center;gap:8px}\n.hero-visual .badge .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}\n@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-glow)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}\n\n.hero-marquee{margin-top:90px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}\n.hero-marquee-track{display:inline-flex;gap:60px;animation:marq 35s linear infinite;font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:18px;color:var(--muted-2)}\n.hero-marquee-track span{display:inline-flex;align-items:center;gap:60px}\n.hero-marquee-track .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}\n@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n\n/* ============== Stats ============== */\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n.stat{padding:36px 28px;border-right:1px solid var(--line);position:relative}\n.stat:last-child{border-right:0}\n.stat .num{font-family:var(--display);font-weight:700;font-size:clamp(40px,5vw,64px);line-height:1;letter-spacing:-.02em}\n.stat .num .plus{color:var(--accent);font-size:.6em;vertical-align:top;margin-left:2px}\n.stat .label{margin-top:10px;color:var(--muted);font-size:13px;letter-spacing:.04em}\n\n/* ============== Services ============== */\n.services-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:56px}\n.svc{grid-column:span 4;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:32px;position:relative;overflow:hidden;transition:border-color .25s ease,transform .25s ease,background .25s ease;display:flex;flex-direction:column;min-height:280px}\n.svc::before{content:\"\";position:absolute;top:0;left:0;width:0;height:1px;background:var(--accent);transition:width .5s ease}\n.svc:hover{border-color:var(--line-2);background:var(--surface-2);transform:translateY(-2px)}\n.svc:hover::before{width:100%}\n.svc.feature{grid-column:span 6;min-height:340px;background:linear-gradient(135deg,#101010,#0a0a0a)}\n.svc.feature .svc-icon{color:var(--accent)}\n.svc.wide{grid-column:span 8}\n.svc.tall{grid-column:span 4;grid-row:span 2;min-height:340px}\n.svc-num{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted-2);text-transform:uppercase}\n.svc-icon{width:48px;height:48px;color:var(--text);margin:20px 0 24px}\n.svc-icon svg{width:100%;height:100%}\n.svc h3{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.01em;margin:0 0 10px}\n.svc p{color:var(--muted);font-size:14.5px;margin:0 0 24px;line-height:1.6}\n.svc .more{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text);font-weight:500}\n.svc .more svg{width:14px;height:14px;transition:transform .25s ease}\n.svc:hover .more svg{transform:translateX(4px);color:var(--accent)}\n.svc .tag{position:absolute;top:24px;right:24px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;padding:5px 10px;border:1px solid var(--accent);border-radius:999px;background:rgba(168,230,53,.05)}\n\n/* ============== Process ============== */\n.process{position:relative}\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:64px;border-top:1px solid var(--line)}\n.step{padding:36px 28px 36px 0;border-right:1px solid var(--line);position:relative}\n.step:last-child{border-right:0;padding-right:0}\n.step .step-num{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--accent);display:flex;align-items:center;gap:10px}\n.step .step-num::before{content:\"\";width:24px;height:1px;background:var(--accent)}\n.step h4{font-family:var(--display);font-weight:600;font-size:22px;margin:20px 0 12px;letter-spacing:-.01em}\n.step p{color:var(--muted);font-size:14.5px;margin:0;line-height:1.6;max-width:32ch}\n.step .dot{position:absolute;top:-5px;left:0;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}\n\n/* ============== Gallery ============== */\n.gallery-wrap{margin-top:56px}\n.before-after{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);user-select:none;touch-action:none;background:#080808}\n.ba-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-tr "svc-icon\">\n          <svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"24\" r=\"18\"><\u002Fcircle><path d=\"M12 24c0-6.6 5.4-12 12-12\"><\u002Fpath><circle cx=\"18\" cy=\"18\" r=\"2\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Kerámia bevonat<\u002Fh3>\n        <p>9H keménységű kvarc-alapú bevonat. Hidrofób hatás, UV-védelem, mélyebb fény.<\u002Fp>\n        <a href=\"#kapcsolat\" class=\"more\">Részletek\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Farticle>\n\n      <article class=\"svc reveal\">\n        <div class=\"svc-num\">03 / Felújítás<\u002Fdiv>\n        <div class=\"svc-icon\">\n          <svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"24\" r=\"14\"><\u002Fcircle><circle cx=\"24\" cy=\"24\" r=\"6\"><\u002Fcircle><path d=\"M24 4v6M24 38v6M4 24h6M38 24h6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Karosszéria polírozás<\u002Fh3>\n        <p>1–3 lépéses gépi polírozás. Karcok, hologramok, oxidáció eltüntetése.<\u002Fp>\n        <a href=\"#kapcsolat\" class=\"more\">Részletek\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Farticle>\n\n      <article class=\"svc reveal\">\n        <div class=\"svc-num\">04 / Esztétika<\u002Fdiv>\n        <div class=\"svc-icon\">\n          <svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d    <div class=\"testimonials-grid\">\n      <article class=\"tst reveal\">\n        <div class=\"stars\" aria-label=\"5 csillag\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"quote-mark\">\"<\u002Fdiv>\n        <p>Két éve vagyok PROVEX ügyfél. A kerámia bevonat ma is úgy gyöngyözi a vizet, mint az első napon. Pontosak, korrektek, és a fotódokumentáció mindent visz.<\u002Fp>\n        <div class=\"who\">\n          <div class=\"avi\">SZ<\u002Fdiv>\n          <div class=\"meta\">\n            <div class=\"name\">Szabó Zoltán<\u002Fdiv>\n            <div class=\"car\">BMW M340i · Kerámia bevonat<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"tst reveal\">\n        <div class=\"stars\" aria-label=\"5 csillag\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"quote-mark\">\"<\u002Fdiv>\n        <p>Új autóra vettem PPF-et a teljes első részre. Egy év, három autópályás út, nulla kőfelverődés a lakkon. Megérte minden forintot. Bencéék tudják, mit csinálnak.<\u002Fp>\n        <div class=\"who\">\n          <div class=\"avi\">KA<\u002Fdiv>\n          <div class=\"meta\">\n            <div class=\"name\">Kovács András<\u002Fdiv>\n            <div class=\"car\">Audi RS6 · PPF teljes első<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"tst reveal\">\n        <div class=\"stars\" aria-label=\"5 csillag\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9\"><\u002Fpolygon><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"quote-mark\">\"<\u002Fdiv>\n        <p>Egy 8 éves Golf R-t hoztam be, „kifényesítésre\". Visszakaptam egy szalonautót. Az utastér is olyan, mint új korában. Egyetlen helyre megyek vissza.<\u002Fp>\n        <div class=\"who\">\n          <div class=\"avi\">NT<\u002Fdiv>\n          <div class=\"meta\">\n            <div class=\"name\">Nagy Tamás<\u002Fdiv>\n            <div class=\"car\">VW Golf R · Full detailing<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== FAQ ============== -->\n<section id=\"gyik\" data-screen-label=\"GYIK\">\n  <div class=\"wrap\">\n    <div class=\"faq-grid\">\n      <div class=\"reveal\">\n        <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>GYIK · 06<\u002Fdiv>\n        <h2 class=\"section-title\">Gyakori<br>kérdések.<\u002Fh2>\n        <p class=\"section-sub\">Ha nem találod itt a kérdésedre a választ, írj nekünk emailben vagy hívj fel. 24 órán belül válaszolunk.<\u002Fp>\n        <a href=\"#kapcsolat\" class=\"btn btn-ghost\" style=\"margin-top:32px\">Tedd fel a kérdésed\n          <svg class=\"arrow\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n\n      <div class=\"faq-list reveal\">\n        <details class=\"qa\">\n          <summary>Mi a különbség a PPF és a kerámia bevonat között?\n            <span class=\"plus\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <div class=\"answer\">A PPF egy ~200 mikron vastag, önregeneráló poliuretán fólia, ami fizikai védelmet ad — megfogja a kőfelverődést, a karcokat, a rovarmaradványokat. A kerámia bevonat ezzel szemben egy ~2–3 mikron vastag kvarc-alapú réteg, ami kémiai védelmet és vízlepergető hatást ad. A kettő nem helyettesíti, hanem kiegészíti egymást — a legjobb védelem PPF + kerámia kombinációban.<\u002Fdiv>\n        <\u002Fdetails>\n        <details class=\"qa\">\n          <summary>Mennyi időt vesz igénybe egy teljes csomag?\n            <span class=\"plus\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <div class=\"answer\">Az Alap csomag 1 munkanap, a Prémium kerámia bevonat 2–3 nap (a kötési idő miatt), az Ultra PPF + kerámia kombináció 5–7 munkanap. Pontos időt a felmérés után tudunk mondani — a határidőt szerződésben rögzítjük.<\u002Fdiv>\n        <\u002Fdetails>\n        <details class=\"qa\">\n          <summary>Milyen garanciát adtok?\n            <span class=\"plus\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <div class=\"answer\">A prémium kerámia bevonatra 5 év, az Ultra csomagra (PPF + kerámia) 10 év írásos gyártói garanciát adunk. A garanciajegyet az átadáskor papíron is megkapod. A garancia rendszeres ellenőrzéshez és ápolási előírások betartásához kötött — minden évben térítésmentesen átnézzük az autód.<\u002Fdiv>\n        <\u002Fdetails>\n        <details class=\"qa\">\n          <summary>Mosható az autó kerámia bevonat / PPF után?\n            <span class=\"plus\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <div class=\"answer\">Igen, sőt: a kerámia bevonatos autó sokkal könnyebben tisztítható, mert a kosz nem tud belekapaszkodni a felületbe. Kerüld a kefés automata mosót — 2-bucket módszerrel mosd otthon, vagy gyere hozzánk fenntartó mosásra. Az első 2 hétben viszont semmilyen vizet ne tegyél rá, hogy a bevonat teljesen kiköthessen.<\u002Fdiv>\n        <\u002Fdetails>\n        <details class=\"qa\">\n          <summary>Új autóra is érdemes PPF-et tenni?\n            <span class=\"plus\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <div class=\"answer\">Új autónál a legjobb a helyzet — a fényezés tökéletes állapotban van, így a PPF azonnal a gyári lakkot védi, nem egy már sérültet. Ráadásul az autó értéke is jobban megmarad, eladáskor a fólia leszedhető, és alatta szalongyári állapot vár.<\u002Fdiv>\n        <\u002Fdetails>\n        <details class=\"qa\">\n          <summary>Visszafordítható a színváltó fóliázás?\n            <span class=\"plus\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fsummary>\n          <div class=\"answer\">Igen, a teljes fóliázás roncsolásmentes és visszafordítható. Egy minőségi vinil fólia 5–7 évig probléma nélkül viselhető, és leszedés után az eredeti fényezés érintetlenül kerül elő. Ezért is népszerű lízingelt vagy bérelt autóknál.<\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== About ============== -->\n<section id=\"rolunk\" data-screen-label=\"Rólunk\">\n  <div class=\"wrap\">\n    <div class=\"reveal\" style=\"max-width:720px\">\n      <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>Rólunk · 07<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"about-grid\">\n      <div class=\"about-img reveal\">\n        <span class=\"placeholder-note\">Helyőrző · Műhely fotó<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"about-text reveal\">\n        <h2>Egy autószerelő<br>műhely, ami<br><span class=\"accent-line\">megszállottan<\u002Fspan><br>figyel a részletekre.<\u002Fh2>\n        <p>A PROVEX nem egy gyors-fényesítő. Egy kontrollált, pormentes box, ahol minden autó ugyanúgy bánásmódot kap, mint a sajátunk. Németországból és Egyesült Államokból hozzuk az alapanyagokat, és csak olyan eljárásokat alkalmazunk, amiknek mérhető, dokumentálható eredménye van.<\u002Fp>\n        <p>A célunk egyszerű: amikor visszakapod az autód, az legyen jobb állapotban, mint amikor behoztad. Nem hosszabban, nem kockázattal — egyszerűen csak jobban.<\u002Fp>\n\n        <div class=\"about-meta\">\n          <div class=\"m\">\n            <h5>Cím<\u002Fh5>\n            <p><span data-t=\"addressShort\">Budapest, XIII. kerület<\u002Fspan><br><span data-t=\"addressNote\" style=\"color:var(--muted);font-size:13px\">Pontos cím egyeztetés után<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n          <div class=\"m\">\n            <h5>Nyitvatartás<\u002Fh5>\n            <p><span data-t=\"hoursMain\">H–P · 08:00 – 18:00<\u002Fspan><br><span data-t=\"hoursSaturday\" style=\"color:var(--muted);font-size:13px\">Szo · előre egyeztetve<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== Contact ============== -->\n<section id=\"kapcsolat\" data-screen-label=\"Kapcsolat\">\n  <div class=\"wrap\">\n    <div class=\"reveal\" style=\"max-width:720px\">\n      <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>Kapcsolat · 08<\u002Fdiv>\n      <h2 class=\"section-title\">Foglalj időpontot.<br>Kérdezz bármit.<\u002Fh2>\n      <p class=\"section-sub\">Írj nekünk pár sort az autódról és arról, mire lenne szükséged. 24 órán belül visszaírunk egy konkrét ajánlattal és időpont javaslattal.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"contact-grid\">\n      <div class=\"contact-info reveal\">\n        <div class=\"info-block\">\n          <d li><a href=\"#szolgaltatasok\">Polírozás<\u002Fa><\u002Fli>\n          <li><a href=\"#szolgaltatasok\">Full wrap<\u002Fa><\u002Fli>\n          <li><a href=\"#szolgaltatasok\">Ablakfólia<\u002Fa><\u002Fli>\n          <li><a href=\"#szolgaltatasok\">Detailing<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"footer-col\">\n        <h6>Cég<\u002Fh6>\n        <ul>\n          <li><a href=\"#rolunk\">Rólunk<\u002Fa><\u002Fli>\n          <li><a href=\"#galeria\">Galéria<\u002Fa><\u002Fli>\n          <li><a href=\"#arak\">Árak<\u002Fa><\u002Fli>\n          <li><a href=\"#gyik\">GYIK<\u002Fa><\u002Fli>\n          <li><a href=\"#kapcsolat\">Kapcsolat<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"footer-col\">\n        <h6>Kapcsolat<\u002Fh6>\n        <ul>\n          <li><a href=\"tel:+36302106895\" data-tel=\"phone\" data-t=\"phone\">+36 30 210 6895<\u002Fa><\u002Fli>\n          <li><a href=\"mailto:kozmetika@provex.hu\" data-mail=\"email\" data-t=\"email\">kozmetika@provex.hu<\u002Fa><\u002Fli>\n          <li><a href=\"#kapcsolat\" data-t=\"addressShort\">Budapest, XIII. ker.<\u002Fa><\u002Fli>\n          <li data-t=\"hoursMain\" style=\"color:var(--muted-2);font-size:13px;margin-top:8px\">H–P · 08:00 – 18:00<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"footer-bot\">\n      <div>© 2026 PROVEX. Minden jog fenntartva.<\u002Fdiv>\n      <div style=\"display:flex;gap:24px\">\n        <a href=\"#\" style=\"color:var(--muted-2)\">Adatvédelem<\u002Fa>\n        <a href=\"#\" style=\"color:var(--muted-2)\">ÁSZF<\u002Fa>\n        <a href=\"#\" style=\"color:var(--muted-2)\">Süti tájékoztató<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n// Sticky nav style change\nconst nav = document.getElementById('topnav');\nconst onScroll = () => {\n  if (window.scrollY > 24) nav.classList.add('scrolled');\n  else nav.classList.remove('scrolled');\n};\nwindow.addEventListener('scroll', onScroll, {passive:true});\nonScroll();\n\n// Reveal on scroll\nconst io = new IntersectionObserver((entries) => {\n  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });\n}, {threshold: .12, rootMargin: '0px 0px -40px 0px'});\ndocument.querySelectorAll('.reveal').forEach(el => io.observe(el));\n\n// Before/After slider\n(function(){\n  const ba = document.getElementById('ba');\n  const after = document.getElementById('baAfter');\n  const knob = document.getElementById('baKnob');\n  const handle = document.getElementById('baHandle');\n  if (!ba) return;\n  let pct = 50;\n  let dragging = false;\n\n  const update = (p) => {\n    pct = Math.max(2, Math.min(98, p));\n    after.style.setProperty('--clip', `polygon(0 0, ${pct}% 0, ${pct}% 100%, 0 100%)`);\n    handle.style.left = pct + '%';\n    knob.style.left = pct + '%';\n  };\n  update(50);\n\n  const posFromEvent = (e) => {\n    const r = ba.getBoundingClientRect();\n    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;\n    return (x / r.width) * 100;\n  };\n\n  const start = (e) => { dragging = true; document.body.style.userSelect='none'; update(posFromEvent(e)); };\n  const move = (e) => { if (!dragging) return; update(posFromEvent(e)); e.preventDefault && e.preventDefault(); };\n  const end = () => { dragging = false; document.body.style.userSelect=''; };\n\n  knob.addEventListener('mousedown', start);\n  ba.addEventListener('mousedown', (e) => { if (e.target !== knob) start(e); });\n  window.addEventListener('mousemove', move);\n  window.addEventListener('mouseup', end);\n\n  knob.addEventListener('touchstart', start, {passive:true});\n  ba.addEventListener('touchstart', (e) => { if (e.target !== knob) start(e); }, {passive:true});\n  window.addEventListener('touchmove', move, {passive:false});\n  window.addEventListener('touchend', end);\n\n  // Idle gentle hint animation\n  let hinted = false;\n  const hint = () => {\n    if (hinted || dragging) return;\n    hinted = true;\n    let t = 0;\n    const id = setInterval(() => {\n      t += 1;\n      const p = 50 + Math.sin(t/8) * 12;\n      if (!dragging) update(p);\n      if (t > 50) { clearInterval(id); update(50); }\n    }, 40);\n  };\n  const hintIO = new IntersectionObserver((entries) => {\n    entries.forEach(e => { if (e.isIntersecting) { setTimeout(hint, 500); hintIO.disconnect(); } });\n  }, {threshold:.4});\n  hintIO.observe(ba);\n})();\n\n// ============== Content loader (CMS) ==============\n// Loads /content.json if present and patches dynamic fields.\n// Site degrades gracefully to hardcoded defaults if file is missing.\n(function(){\n  fetch('content.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{\n    if(!d) return;\n    const dig = (key) => key.split('.').reduce((o,k)=> (o==null?undefined:o[k]), d);\n    document.querySelectorAll('[data-t]').forEach(el=>{\n      const v = dig(el.dataset.t);\n      if(v!=null && v!=='') el.textContent = v;\n    });\n    document.querySelectorAll('[data-tel]').forEach(el=>{\n      const v = dig(el.dataset.tel);\n      if(v!=null && v!=='') el.href = 'tel:'+String(v).replace(/[^\\d+]/g,'');\n    });\n    document.querySelectorAll('[data-mail]').forEach(el=>{\n      const v = dig(el.dataset.mail);\n      if(v!=null && v!=='') el.href = 'mailto:'+v;\n    });\n  }).catch(()=>{});\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
